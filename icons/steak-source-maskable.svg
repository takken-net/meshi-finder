<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a0d0d"/>
      <stop offset="0.55" stop-color="#7a1414"/>
      <stop offset="1" stop-color="#b4241c"/>
    </linearGradient>

    <radialGradient id="meat" cx="30%" cy="28%" r="90%">
      <stop offset="0" stop-color="#c47347"/>
      <stop offset="0.4" stop-color="#92472a"/>
      <stop offset="0.75" stop-color="#612715"/>
      <stop offset="1" stop-color="#3a150a"/>
    </radialGradient>

    <linearGradient id="fat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e6c8"/>
      <stop offset="1" stop-color="#dcb888"/>
    </linearGradient>

    <linearGradient id="bone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf6e8"/>
      <stop offset="1" stop-color="#e1c998"/>
    </linearGradient>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#190404" flood-opacity="0.5"/>
    </filter>

    <clipPath id="meatClip">
      <rect x="76" y="76" width="320" height="300" rx="88" transform="rotate(-10 236 226)"/>
    </clipPath>
  </defs>

  <!-- 背景（マスク用：角丸なしフルブリード） -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- 内容全体をセーフゾーン（中央80%）に収める -->
  <g transform="translate(51.2 51.2) scale(0.8)">
    <!-- 影 -->
    <ellipse cx="225" cy="420" rx="150" ry="22" fill="#150303" opacity="0.4"/>

    <g filter="url(#soft)">
      <!-- 骨 -->
      <path d="M 340 270
               C 388 254 436 272 448 318
               C 460 364 430 400 388 400
               C 356 400 330 380 324 352
               L 314 300
               Z"
            fill="url(#bone)" stroke="#c7a568" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="420" cy="332" rx="13" ry="10" fill="#c7a568" opacity="0.45"/>

      <!-- 肉本体 -->
      <rect x="76" y="76" width="320" height="300" rx="88" transform="rotate(-10 236 226)"
            fill="url(#meat)" stroke="#2a0f08" stroke-width="6"/>

      <!-- 脂身のライン -->
      <path d="M70 180 C 140 124 240 110 320 148"
            fill="none" stroke="url(#fat)" stroke-width="14" stroke-linecap="round" opacity="0.9" clip-path="url(#meatClip)"/>
      <path d="M50 300 C 140 266 260 262 370 304"
            fill="none" stroke="url(#fat)" stroke-width="9" stroke-linecap="round" opacity="0.5" clip-path="url(#meatClip)"/>

      <!-- グリルの焼き目 -->
      <g stroke="#1e0905" stroke-width="16" stroke-linecap="round" opacity="0.6" clip-path="url(#meatClip)">
        <line x1="0"   y1="150" x2="220" y2="500"/>
        <line x1="90"  y1="90"  x2="310" y2="460"/>
        <line x1="190" y1="60"  x2="400" y2="420"/>
        <line x1="300" y1="70"  x2="470" y2="340"/>
      </g>
      <g stroke="#190805" stroke-width="7" stroke-linecap="round" opacity="0.4" clip-path="url(#meatClip)">
        <line x1="20"  y1="230" x2="450" y2="140"/>
        <line x1="10"  y1="330" x2="450" y2="250"/>
        <line x1="60"  y1="430" x2="430" y2="360"/>
      </g>

      <!-- ハイライト -->
      <ellipse cx="170" cy="160" rx="80" ry="42" fill="#ffffff" opacity="0.15" clip-path="url(#meatClip)"/>
    </g>

    <!-- 湯気 -->
    <g stroke="#ffe9d6" stroke-width="13" stroke-linecap="round" fill="none" opacity="0.6">
      <path d="M176 66 C 154 46, 186 30, 166 8"/>
      <path d="M224 58 C 202 38, 234 22, 214 0"/>
    </g>
  </g>
</svg>
